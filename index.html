<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ridho Farizqi - CV &amp; Resume</title>
  
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen h-[100dvh] flex flex-col overflow-hidden antialiased">

  <!-- NAVBAR (Header tetap di atas) -->
  <header class="shrink-0 z-20 bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-14">
        
        <!-- Identity -->
        <div class="min-w-0">
          <div class="font-bold text-slate-900 text-sm sm:text-base leading-none">Ridho Farizqi</div>
          <div class="text-[11px] text-slate-500 mt-1" id="docSubInfo">Curriculum Vitae</div>
        </div>

        <!-- Direct Actions -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <!-- Canvas Zoom Controller (A4 / Fit / Zoom) -->
          <div class="inline-flex items-center rounded-md border border-slate-300 bg-white p-0.5 text-xs text-slate-700 shadow-xs">
            <button 
              id="btnZoomOut" 
              type="button" 
              class="w-7 h-7 flex items-center justify-center font-bold hover:bg-slate-100 rounded text-slate-600 hover:text-slate-900 transition cursor-pointer" 
              title="Perkecil (Zoom Out)"
              aria-label="Perkecil Kanvas"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
            </button>
            <button 
              id="btnZoomFit" 
              type="button" 
              class="px-2 h-7 flex items-center justify-center text-[11px] font-mono text-slate-700 hover:bg-slate-100 rounded transition cursor-pointer select-none min-w-[46px] text-center" 
              title="Klik untuk Fit Layar / Ukuran 100%"
            >
              <span id="zoomLabel">Fit</span>
            </button>
            <button 
              id="btnZoomIn" 
              type="button" 
              class="w-7 h-7 flex items-center justify-center font-bold hover:bg-slate-100 rounded text-slate-600 hover:text-slate-900 transition cursor-pointer" 
              title="Perbesar (Zoom In)"
              aria-label="Perbesar Kanvas"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
          </div>

          <button 
            id="btnPrint" 
            class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-50 hover:bg-slate-100 border border-slate-300 rounded-md transition cursor-pointer"
            title="Cetak atau Simpan PDF"
          >
            <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
            </svg>
            <span class="hidden sm:inline">Cetak PDF</span>
          </button>

          <a 
            id="btnNewTab" 
            href="menu/cv.html" 
            target="_blank" 
            class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 text-xs font-medium text-slate-700 bg-white hover:bg-slate-50 border border-slate-300 rounded-md transition"
            title="Buka dokumen di tab baru"
          >
            <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            <span class="hidden sm:inline">Tab Baru</span>
          </a>
        </div>

      </div>

      <!-- Clean Segmented Tabs (No nested pill tags) -->
      <nav id="docTabs" class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-2.5 pt-0.5 text-xs" aria-label="Pilihan Dokumen">
        <!-- Rendered by JavaScript -->
      </nav>
    </div>
  </header>

  <!-- DOCUMENT VIEWER (Kanvas pengunci viewport) -->
  <main class="flex-1 min-h-0 w-full max-w-5xl mx-auto sm:px-4 sm:py-3 flex flex-col overflow-hidden">
    <div id="viewerWrapper" class="flex-1 min-h-0 bg-slate-200/70 sm:rounded-lg sm:border sm:border-slate-300 sm:shadow-xs overflow-auto flex flex-col items-center">
      <iframe 
        id="docFrame" 
        src="menu/cv.html" 
        class="w-full h-full flex-1 border-0 bg-transparent block"
        title="Dokumen Pratinjau"
      ></iframe>
    </div>
  </main>

  <!-- STICKY FOOTER (Selalu menempel di bawah) -->
  <footer class="shrink-0 bg-white border-t border-slate-200 py-2.5 px-4 text-center text-xs text-slate-500 z-20">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-center gap-x-3 gap-y-1">
      <a href="mailto:rizfariz2003@gmail.com" class="hover:text-slate-900 transition">rizfariz2003@gmail.com</a>
      <span>•</span>
      <a href="https://wa.me/6285155223695" target="_blank" class="hover:text-slate-900 transition">0851-5522-3695</a>
      <span>•</span>
      <a href="https://linkedin.com/in/ridho-farizqi" target="_blank" class="hover:text-slate-900 transition">LinkedIn</a>
      <span>•</span>
      <a href="https://github.com/faarizzqi" target="_blank" class="hover:text-slate-900 transition">GitHub</a>
    </div>
  </footer>

  <script>
    const DOCUMENTS = [
      {
        id: "cv",
        label: "CV Utama",
        role: "S1 Sistem Informasi",
        path: "menu/cv.html"
      },
      {
        id: "resume1",
        label: "Resume Data Analyst",
        role: "Spesialisasi Data Analytics & Machine Learning",
        path: "menu/resume1.html"
      },
      {
        id: "resume2",
        label: "Resume IT Support",
        role: "Spesialisasi IT Support & Jaringan",
        path: "menu/resume2.html"
      },
      {
        id: "resume3",
        label: "Resume Staff IT",
        role: "Spesialisasi Staff IT (Jaringan, Database & Web)",
        path: "menu/resume3.html"
      }
    ];

    let activeDocId = "cv";
    let currentZoom = 1.0;
    let isFitMode = false;

    const docTabs = document.getElementById("docTabs");
    const docFrame = document.getElementById("docFrame");
    const btnNewTab = document.getElementById("btnNewTab");
    const btnPrint = document.getElementById("btnPrint");
    const docSubInfo = document.getElementById("docSubInfo");
    const zoomLabel = document.getElementById("zoomLabel");
    const btnZoomOut = document.getElementById("btnZoomOut");
    const btnZoomIn = document.getElementById("btnZoomIn");
    const btnZoomFit = document.getElementById("btnZoomFit");

    function calculateFitScale() {
      // Document sheet width is ~820px (8.5in = 816px)
      const containerWidth = docFrame.clientWidth || window.innerWidth;
      const targetSheetWidth = 836;
      const fit = (containerWidth - (window.innerWidth < 640 ? 8 : 24)) / targetSheetWidth;
      return Math.min(1.0, Math.max(0.30, Math.round(fit * 100) / 100));
    }

    function applyZoomToFrame() {
      try {
        const frameDoc = docFrame.contentDocument || docFrame.contentWindow.document;
        if (frameDoc && frameDoc.body) {
          frameDoc.body.style.zoom = currentZoom;
        }
        if (isFitMode) {
          zoomLabel.textContent = "Fit";
        } else {
          zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
        }
      } catch (err) {
        console.warn("Zoom error:", err);
      }
    }

    function setZoom(newScale, fitState = false) {
      isFitMode = fitState;
      currentZoom = Math.round(Math.min(Math.max(newScale, 0.30), 2.0) * 100) / 100;
      applyZoomToFrame();
    }

    btnZoomOut.addEventListener("click", () => {
      setZoom(currentZoom - 0.10, false);
    });

    btnZoomIn.addEventListener("click", () => {
      setZoom(currentZoom + 0.10, false);
    });

    btnZoomFit.addEventListener("click", () => {
      if (isFitMode || currentZoom < 0.95) {
        // Toggle to 100% actual size
        setZoom(1.0, false);
      } else {
        // Toggle to Fit to Screen
        setZoom(calculateFitScale(), true);
      }
    });

    window.addEventListener("resize", () => {
      if (isFitMode) {
        setZoom(calculateFitScale(), true);
      }
    });

    function renderTabs() {
      docTabs.innerHTML = DOCUMENTS.map(doc => {
        const isActive = doc.id === activeDocId;
        return `
          <button 
            type="button"
            onclick="switchDocument('${doc.id}')"
            class="px-3 py-1.5 rounded-md font-medium whitespace-nowrap transition cursor-pointer text-xs ${
              isActive 
                ? 'bg-slate-900 text-white shadow-xs' 
                : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100 bg-white border border-slate-200'
            }"
          >
            ${doc.label}
          </button>
        `;
      }).join('');
    }

    function switchDocument(id) {
      const doc = DOCUMENTS.find(d => d.id === id);
      if (!doc) return;

      activeDocId = id;
      renderTabs();

      docSubInfo.textContent = doc.role;
      btnNewTab.href = doc.path;
      docFrame.src = doc.path;

      docFrame.onload = () => {
        try {
          const frameDoc = docFrame.contentDocument || docFrame.contentWindow.document;
          if (frameDoc) {
            const innerToolbar = frameDoc.querySelector('.toolbar');
            if (innerToolbar) innerToolbar.style.display = 'none';

            // Double click anywhere on document toggles between Fit and 100%
            frameDoc.addEventListener('dblclick', () => {
              btnZoomFit.click();
            });
          }

          // Mobile defaults to Fit, Desktop defaults to 100%
          if (window.innerWidth < 850) {
            setZoom(calculateFitScale(), true);
          } else {
            setZoom(1.0, false);
          }
        } catch (e) {
          // Cross-origin fallback
        }
      };
    }

    btnPrint.addEventListener('click', () => {
      try {
        if (docFrame.contentWindow) {
          docFrame.contentWindow.focus();
          docFrame.contentWindow.print();
        } else {
          window.open(btnNewTab.href, '_blank');
        }
      } catch (err) {
        window.open(btnNewTab.href, '_blank');
      }
    });

    renderTabs();
    switchDocument("cv");
  </script>
</body>
</html>
